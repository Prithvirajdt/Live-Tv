name: Update Master Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create folders
        run: |
          mkdir -p sources
          mkdir -p build

      - name: Download playlists (sources hidden)
        env:
          SRC_LGTV: ${{ secrets.SRC_LGTV }}
          SRC_JTV:  ${{ secrets.SRC_JTV }}
          SRC_ZEE5: ${{ secrets.SRC_ZEE5 }}
        run: |
          wget -q -O sources/lgtv.m3u "$SRC_LGTV"
          wget -q -O sources/jtv.m3u  "$SRC_JTV"
          wget -q -O sources/zee5.m3u "$SRC_ZEE5"

      - name: Build master playlist
        run: |
          echo "#EXTM3U" > build/master.m3u

          # Static playlist (unchanged)
          if [ -f static/my_static.m3u ]; then
            sed '1d' static/my_static.m3u >> build/master.m3u
          fi

          # -------------------------
          # ZEE5 PROCESSING
          # -------------------------
          if [ -f sources/zee5.m3u ]; then
            sed '1d' sources/zee5.m3u \
            | grep -Ev 'group-title="(Bengali|Gujarati|Kannada|Malayalam|Odia|Punjabi|Spiritual|Tamil|Telugu)"' \
            | grep -Ev ',Zee 24 Taas$' \
            | sed \
                -e 's/group-title="[^"]*".*,Zee Chitramandir/group-title="Movies",Zee Chitramandir/' \
                -e 's/group-title="[^"]*".*,Zee Talkies HD/group-title="Movies",Zee Talkies HD/' \
                -e 's/group-title="[^"]*".*,Zee Talkies/group-title="Movies",Zee Talkies/' \
                -e 's/group-title="[^"]*".*,Zee Marathi HD/group-title="Entertainment",Zee Marathi HD/' \
                -e 's/group-title="[^"]*".*,Zee Marathi/group-title="Entertainment",Zee Marathi/' \
                -e 's/group-title="[^"]*".*,Zee Anmol/group-title="Entertainment",Zee Marathi/' \
                -e 's/group-title="[^"]*".*,Zee Yuva/group-title="Entertainment",Zee Yuva/' \
            >> build/master.m3u
          fi

          # -------------------------
          # LGTV (unchanged)
          # -------------------------
          if [ -f sources/lgtv.m3u ]; then
            sed '1d' sources/lgtv.m3u >> build/master.m3u
          fi

          # -------------------------
          # JioTV (unchanged)
          # -------------------------
          if [ -f sources/jtv.m3u ]; then
            sed '1d' sources/jtv.m3u >> build/master.m3u
          fi

          # Safety: remove any source references
          sed -i '/githubusercontent.com/d' build/master.m3u
          sed -i '/raw.githubusercontent.com/d' build/master.m3u

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add build/master.m3u
          git commit -m "Auto update master playlist" || true
          git push
