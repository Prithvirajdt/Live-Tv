name: Update Master Playlist

# --------------------------------------------------
# WHEN THIS WORKFLOW RUNS
# --------------------------------------------------
# 1. Manually (workflow_dispatch)
# 2. Automatically every 6 hours
# --------------------------------------------------
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # STEP 1: CHECKOUT REPOSITORY
      # --------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # --------------------------------------------------
      # STEP 2: ENSURE build/ DIRECTORY EXISTS
      # - Required so Git tracks the folder
      # - .gitkeep avoids empty-folder issues
      # --------------------------------------------------
      - name: Ensure build folder exists
        run: |
          mkdir -p build
          touch build/.gitkeep
          git add build/.gitkeep
          git commit -m "Ensure build folder exists" || echo "No changes"
          git push || echo "Push skipped"

      # --------------------------------------------------
      # STEP 3: CREATE TEMP SOURCES FOLDER
      # - Holds downloaded playlists
      # --------------------------------------------------
      - name: Create sources folder
        run: |
          mkdir -p sources

      # --------------------------------------------------
      # STEP 4: DOWNLOAD ALL SOURCE PLAYLISTS
      # - URLs are stored securely in GitHub Secrets
      # - Nothing sensitive is exposed in code
      # --------------------------------------------------
      - name: Download playlists (sources hidden)
        env:
          SRC_LGTV:    ${{ secrets.SRC_LGTV }}
          SRC_JTV:     ${{ secrets.SRC_JTV }}
          SRC_ZEE5:    ${{ secrets.SRC_ZEE5 }}
          SRC_TATA_TV: ${{ secrets.SRC_TATA_TV }}
          SRC_SONY:    ${{ secrets.SRC_SONY }}
        run: |
          wget -q -O sources/lgtv.m3u     "$SRC_LGTV"
          wget -q -O sources/jtv.m3u      "$SRC_JTV"
          wget -q -O sources/zee5.m3u     "$SRC_ZEE5"
          wget -q -O sources/tata_tv.m3u  "$SRC_TATA_TV"
          wget -q -O sources/sony.m3u     "$SRC_SONY"

      # --------------------------------------------------
      # STEP 5: BUILD MASTER PLAYLIST
      # --------------------------------------------------
      - name: Build master playlist
        run: |
          mkdir -p build

          # Create temp playlist and write M3U header
          echo "#EXTM3U" > build/VortexVision.tmp

          # --------------------------------------------------
          # STATIC PLAYLIST (ALWAYS FIRST)
          # --------------------------------------------------
          if [ -f static/my_static.m3u ]; then
            sed '1d' static/my_static.m3u >> build/VortexVision.tmp
          fi

          # --------------------------------------------------
          # ZEE5: FILTER + NORMALIZE GROUP TITLES
          # --------------------------------------------------
          if [ -f sources/zee5.m3u ]; then
            sed '1d' sources/zee5.m3u \
            | grep -Ev 'group-title="(Bengali|Gujarati|Kannada|Malayalam|Odia|Punjabi|Spiritual|Tamil|Telugu)"' \
            | grep -Ev ',Zee 24 Taas$' \
            | sed \
                -e 's/group-title="[^"]*".*,Zee Anmol$/group-title="Entertainment",Zee Anmol/' \
            >> build/VortexVision.tmp
          fi

          # --------------------------------------------------
          # SONY: KEEP ONLY "SONY MARATHII"
          # --------------------------------------------------
          if [ -f sources/sony.m3u ]; then
            sed '1d' sources/sony.m3u \
            | awk '
                /^#EXTINF/ {
                  keep = ($0 ~ /,Sony Marathii$/)
                  if (keep) {
                    gsub(/group-title="[^"]*"/, "group-title=\"Entertainment\"")
                  }
                }
                keep { print }
              ' >> build/VortexVision.tmp
          fi

          # --------------------------------------------------
          # TATA TV: KEEP KIDS CHANNELS ONLY
          # --------------------------------------------------
          if [ -f sources/tata_tv.m3u ]; then
            sed '1d' sources/tata_tv.m3u \
            | awk '
                /^#EXTINF/ {
                  keep = ($0 ~ /group-title="KIDS - 24X7"/)
                  if (keep) {
                    gsub(/group-title="KIDS - 24X7"/, "group-title=\"Kids 24/7\"")
                  }
                }
                keep { print }
              ' >> build/VortexVision.tmp
          fi

          # ==================================================
          # LGTV
          # ==================================================
          if [ -f sources/lgtv.m3u ]; then
            sed '1d' sources/lgtv.m3u >> build/VortexVision.tmp
          fi

          # ==================================================
          # JIOTV
          # ==================================================
          if [ -f sources/jtv.m3u ]; then
            sed '1d' sources/jtv.m3u >> build/VortexVision.tmp
          fi

          # --------------------------------------------------
          # REMOVE CHANNELS BY NAME (CASE-INSENSITIVE)
          # --------------------------------------------------
          awk '
            /^#EXTINF/ {
              name = $0
              sub(/.*?,/, "", name)

              if (tolower(name) ~ /(tamil|telugu|kannada|bangla|malayalam|english|test|wow|swayam|sathee|bie|cie|vidya|gujarat|bengali|asianet|maa|ptc|vijay|etv|aath|rongeen|raj|punjab|manorama|mahaa|jaya|gemini|udaya|salaam|biskope|surya|adithya|amrita|colors super$|arunprabha|girnar|kashir|oriya|saptagiri|urdu|podhigai|desi channel$|kairali|jalsha|studio|apex|flower|jonack|kalaignar|makkal|mango|may|mk|moon|nakshatra|bangalore|peppers|polimer|puthu|sanjha|sidharth|spondon|kiran|sun tv|sundrani|suvarna|thanthi|vaanavil|vasanth|vendhar|vissa|jomjomat|j movies|ktv|maha|mahua|pitaara|public m|sun life|tabbar|thalaa|tolly|chintu|chutti|kochu|kushi|naap|east|sun music|sun news|nick junior|sonic marathi$|rang$|sristi|teh|haryana|mh)/) {
                skip = 1
              } else {
                skip = 0
                print
              }
              next
            }
            !skip { print }
          ' build/VortexVision.tmp > build/VortexVision.filtered

          mv build/VortexVision.filtered build/VortexVision.tmp

          # --------------------------------------------------
          # DEDUPLICATION (BY CHANNEL NAME, FIRST WINS)
          # --------------------------------------------------
          awk '
            /^#EXTINF/ {
              name = $0
              sub(/.*?,/, "", name)

              if (!(name in seen)) {
                seen[name] = 1
                keep = 1
                print
              } else {
                keep = 0
              }
              next
            }
            keep { print }
          ' build/VortexVision.tmp > build/VortexVision.xyn

          # --------------------------------------------------
          # SAFETY CLEANUP (BLOCK RAW GITHUB LINKS)
          # --------------------------------------------------
          sed -i '/githubusercontent.com/d' build/VortexVision.xyn
          sed -i '/raw.githubusercontent.com/d' build/VortexVision.xyn

      # --------------------------------------------------
      # STEP 6: COMMIT & PUSH FINAL PLAYLIST
      # --------------------------------------------------
      - name: Commit and push playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add build/VortexVision.xyn
          git diff-index --quiet HEAD || git commit -m "Auto update VortexVision playlist"
          git push || echo "No changes to push"
