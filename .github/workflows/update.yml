name: Update Master Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure build folder exists
        run: |
          mkdir -p build
          # Add .gitkeep to ensure folder is tracked
          touch build/.gitkeep
          git add build/.gitkeep
          git commit -m "Ensure build folder exists" || echo "Folder already exists"
          git push || echo "Push failed (probably no changes)"

      - name: Create sources folder
        run: |
          mkdir -p sources

      - name: Download playlists (sources hidden)
        env:
          SRC_LGTV:    ${{ secrets.SRC_LGTV }}
          SRC_JTV:     ${{ secrets.SRC_JTV }}
          SRC_ZEE5:    ${{ secrets.SRC_ZEE5 }}
          SRC_TATA_TV: ${{ secrets.SRC_TATA_TV }}
        run: |
          wget -q -O sources/lgtv.m3u     "$SRC_LGTV"
          wget -q -O sources/jtv.m3u      "$SRC_JTV"
          wget -q -O sources/zee5.m3u     "$SRC_ZEE5"
          wget -q -O sources/tata_tv.m3u  "$SRC_TATA_TV"

      - name: Build master playlist
        run: |
          # Fixed path for master playlist
          mkdir -p build
          echo "#EXTM3U" > build/VortexVision.xyn

          # Append static playlist if exists
          if [ -f static/my_static.m3u ]; then
            sed '1d' static/my_static.m3u >> build/VortexVision.xyn
          fi

          # -------------------------
          # ZEE5 PROCESSING
          # -------------------------
          if [ -f sources/zee5.m3u ]; then
            sed '1d' sources/zee5.m3u \
            | grep -Ev 'group-title="(Bengali|Gujarati|Kannada|Malayalam|Odia|Punjabi|Spiritual|Tamil|Telugu)"' \
            | grep -Ev ',Zee 24 Taas$' \
            | sed \
                -e 's/group-title="[^"]*".*,Zee Chitramandir$/group-title="Movies",Zee Chitramandir/' \
                -e 's/group-title="[^"]*".*,Zee Talkies$/group-title="Movies",Zee Talkies/' \
                -e 's/group-title="[^"]*".*,Zee Marathi$/group-title="Entertainment",Zee Marathi/' \
                -e 's/group-title="[^"]*".*,Zee Anmol$/group-title="Entertainment",Zee Anmol/' \
                -e 's/group-title="[^"]*".*,Zee Yuva$/group-title="Entertainment",Zee Yuva/' \
            >> build/VortexVision.xyn
          fi

          # -------------------------
          # TATA TV → ONLY KIDS - 24X7 renamed
          # -------------------------
          if [ -f sources/tata_tv.m3u ]; then
            sed '1d' sources/tata_tv.m3u \
            | awk '
                /^#EXTINF/ {
                  keep = ($0 ~ /group-title="KIDS - 24X7"/)
                  if (keep) {
                    gsub(/group-title="KIDS - 24X7"/, "group-title=\"Kids 24/7\"")
                  }
                }
                keep { print }
              ' \
            >> build/VortexVision.xyn
          fi

          # -------------------------
          # LGTV (unchanged)
          # -------------------------
          if [ -f sources/lgtv.m3u ]; then
            sed '1d' sources/lgtv.m3u >> build/VortexVision.xyn
          fi

          # -------------------------
          # JioTV (unchanged)
          # -------------------------
          if [ -f sources/jtv.m3u ]; then
            sed '1d' sources/jtv.m3u >> build/VortexVision.xyn
          fi

          # -------------------------
          # Safety cleanup
          # -------------------------
          sed -i '/githubusercontent.com/d' build/VortexVision.xyn
          sed -i '/raw.githubusercontent.com/d' build/VortexVision.xyn

      - name: Commit and push playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f build/VortexVision.xyn ]; then
            git add build/VortexVision.xyn
            # Only commit if there are changes
            git diff-index --quiet HEAD || git commit -m "Auto update VortexVision playlist"
            git push || echo "Push failed (probably no changes)"
          else
            echo "Playlist file build/VortexVision.xyn not found, skipping commit"
          fi

