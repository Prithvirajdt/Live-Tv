name: Update Master Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure build folder exists
        run: |
          mkdir -p build
          touch build/.gitkeep
          git add build/.gitkeep
          git commit -m "Ensure build folder exists" || echo "Folder already exists"
          git push || echo "Push failed (probably no changes)"

      - name: Create sources folder
        run: |
          mkdir -p sources

      - name: Download playlists (sources hidden)
        env:
          SRC_LGTV:    ${{ secrets.SRC_LGTV }}
          SRC_JTV:     ${{ secrets.SRC_JTV }}
          SRC_ZEE5:    ${{ secrets.SRC_ZEE5 }}
          SRC_TATA_TV: ${{ secrets.SRC_TATA_TV }}
          SRC_IPTV_IN: ${{ secrets.SRC_IPTV_IN }}
          SRC_SONY:    ${{ secrets.SRC_SONY }}
        run: |
          wget -q -O sources/lgtv.m3u     "$SRC_LGTV"
          wget -q -O sources/jtv.m3u      "$SRC_JTV"
          wget -q -O sources/zee5.m3u     "$SRC_ZEE5"
          wget -q -O sources/tata_tv.m3u  "$SRC_TATA_TV"
          wget -q -O sources/iptv_in.m3u  "$SRC_IPTV_IN"
          wget -q -O sources/sony.m3u     "$SRC_SONY"

      - name: Build master playlist
        run: |
          mkdir -p build
          echo "#EXTM3U" > build/VortexVision.tmp

          # -------------------------
          # Static playlist FIRST
          # -------------------------
          if [ -f static/my_static.m3u ]; then
            sed '1d' static/my_static.m3u >> build/VortexVision.tmp
          fi

          # -------------------------
          # ZEE5
          # -------------------------
          if [ -f sources/zee5.m3u ]; then
            sed '1d' sources/zee5.m3u \
            | grep -Ev 'group-title="(Bengali|Gujarati|Kannada|Malayalam|Odia|Punjabi|Spiritual|Tamil|Telugu)"' \
            | grep -Ev ',Zee 24 Taas$' \
            | sed \
                -e 's/group-title="[^"]*".*,Zee Chitramandir/group-title="Movies",Zee Chitramandir/' \
                -e 's/group-title="[^"]*".*,Zee Talkies/group-title="Movies",Zee Talkies/' \
                -e 's/group-title="[^"]*".*,Zee Marathi/group-title="Entertainment",Zee Marathi/' \
                -e 's/group-title="[^"]*".*,Zee Anmol$/group-title="Entertainment",Zee Anmol/' \
                -e 's/group-title="[^"]*".*,Zee Yuva/group-title="Entertainment",Zee Yuva/' \
            >> build/VortexVision.tmp
          fi

          # -------------------------
          # Sony Marathi
          # -------------------------
          if [ -f sources/sony.m3u ]; then
            sed '1d' sources/sony.m3u \
            | awk '
                /^#EXTINF/ {
                  keep = ($0 ~ /,Sony Marathii$/)
                  if (keep) {
                    gsub(/group-title="[^"]*"/, "group-title=\"Entertainment\"")
                  }
                }
                keep { print }
              ' \
            >> build/VortexVision.tmp
          fi

          # -------------------------
          # TATA TV (Kids)
          # -------------------------
          if [ -f sources/tata_tv.m3u ]; then
            sed '1d' sources/tata_tv.m3u \
            | awk '
                /^#EXTINF/ {
                  keep = ($0 ~ /group-title="KIDS - 24X7"/)
                  if (keep) {
                    gsub(/group-title="KIDS - 24X7"/, "group-title=\"Kids 24/7\"")
                  }
                }
                keep { print }
              ' \
            >> build/VortexVision.tmp
          fi

          # -------------------------
          # LGTV
          # -------------------------
          if [ -f sources/lgtv.m3u ]; then
            sed '1d' sources/lgtv.m3u >> build/VortexVision.tmp
          fi

          # -------------------------
          # JioTV
          # -------------------------
          if [ -f sources/jtv.m3u ]; then
            sed '1d' sources/jtv.m3u >> build/VortexVision.tmp
          fi

          # -------------------------------------------------
          # REMOVE CHANNELS BY NAME KEYWORDS (CASE-INSENSITIVE)
          # -------------------------------------------------
          awk '
            /^#EXTINF/ {
              name = $0
              sub(/.*?,/, "", name)

              if (tolower(name) ~ /(tamil|telugu|kannada|bangla|malayalam|english|test|wow|swayam|sathee|bie|cie|vidya|gujarat|bengali|asianet|maa|ptc|vijay|etv|aath|rongeen|raj|punjab|manorama|mahaa|jaya|gemini|udaya|salaam|biskope|surya|adithya|amrita|colors super$|arunprabha|girnar|kashir|oriya|saptagiri|urdu|podhigai|desi channel$|kairali|jalsha|studio|apex|flower|jonack|kalaignar|makkal|mango|may|mk|moon|nakshatra|bangalore|peppers|polimer|puthu|sanjha|sidharth|spondon|kiran|sun tv|sundrani|suvarna|thanthi|vaanavil|vasanth|vendhar|vissa|jomjomat|j movies|ktv|maha|mahua|pitaara|public m|sun life|tabbar|thalaa|tolly|chintu|chutti|kochu|kushi|naap|east|sun music|sun news|nick junior|sonic marathi$|rang$)/) {
                skip = 1
              } else {
                skip = 0
                print
              }
              next
            }

            !skip {
              print
            }
          ' build/VortexVision.tmp > build/VortexVision.filtered

          mv build/VortexVision.filtered build/VortexVision.tmp

          # -------------------------------------------------
          # CORRECT DEDUPE (BY CHANNEL NAME, FIRST WINS)
          # -------------------------------------------------
          awk '
            /^#EXTINF/ {
              name = $0
              sub(/.*?,/, "", name)

              if (!(name in seen)) {
                seen[name] = 1
                keep = 1
                print
              } else {
                keep = 0
              }
              next
            }

            keep {
              print
            }
          ' build/VortexVision.tmp > build/VortexVision.xyn

          # -------------------------
          # Safety cleanup
          # -------------------------
          sed -i '/githubusercontent.com/d' build/VortexVision.xyn
          sed -i '/raw.githubusercontent.com/d' build/VortexVision.xyn

      - name: Commit and push playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add build/VortexVision.xyn
          git diff-index --quiet HEAD || git commit -m "Auto update VortexVision playlist"
          git push || echo "Push failed (probably no changes)"
